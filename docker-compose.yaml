networks:
  microservices-network:
    name: bwfc_microservices-network
    driver: bridge

volumes:
  locations-db-data:
  products-db-data:
  warehouse-db-data:
  routing-db-data:
  demands-db-data:

services:
  # ========================================
  # Traefik Reverse Proxy
  # ========================================
  traefik:
    image: traefik:v2.11
    container_name: traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - microservices-network
    restart: unless-stopped

  # ========================================
  # Databases
  # ========================================
  locations-db:
    image: postgres:15-alpine
    container_name: locations-db
    environment:
      POSTGRES_DB: locations_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - locations-db-data:/var/lib/postgresql/data
      - ./database/location-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  products-db:
    image: postgres:15-alpine
    container_name: products-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - products-db-data:/var/lib/postgresql/data
      - ./database/product-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-db:
    image: postgres:15-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
      - ./database/warehouse-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  routing-db:
    image: postgres:15-alpine
    container_name: routing-db
    environment:
      POSTGRES_DB: routing_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - routing-db-data:/var/lib/postgresql/data
      - ./database/routing-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  demands-db:
    image: postgres:15-alpine
    container_name: demands-db
    environment:
      POSTGRES_DB: demands_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - demands-db-data:/var/lib/postgresql/data
      - ./database/demand-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================
  # Microservices
  # ========================================
  location-service:
    build: ./services/location-service
    container_name: location-service
    environment:
      DB_HOST: locations-db
      DB_PORT: 5432
      DB_NAME: locations_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: 3001
    expose:
      - "3001"
    depends_on:
      locations-db:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  product-service:
    build: ./services/product-service
    container_name: product-service
    environment:
      DB_HOST: products-db
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "3002"
    depends_on:
      products-db:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  warehouse-service:
    build: ./services/warehouse-service
    container_name: warehouse-service
    environment:
      DB_HOST: warehouse-db
      DB_PORT: 5432
      DB_NAME: warehouse_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "3003"
    depends_on:
      warehouse-db:
        condition: service_healthy
      location-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  routing-service:
    build: ./services/routing-service
    container_name: routing-service
    environment:
      DB_HOST: routing-db
      DB_PORT: 5432
      DB_NAME: routing_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "3004"
    depends_on:
      routing-db:
        condition: service_healthy
      location-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  demand-service:
    build: ./services/demand-service
    container_name: demand-service
    environment:
      DB_HOST: demands-db
      DB_PORT: 5432
      DB_NAME: demands_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: 3005
      LOCATION_SERVICE_URL: http://location-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    expose:
      - "3005"
    depends_on:
      demands-db:
        condition: service_healthy
      location-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  validation-service:
    build: ./services/validation-service
    container_name: validation-service
    environment:
      PORT: 3006
      LOCATION_SERVICE_URL: http://location-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      WAREHOUSE_SERVICE_URL: http://warehouse-service:3003
      ROUTING_SERVICE_URL: http://routing-service:3004
      DEMAND_SERVICE_URL: http://demand-service:3005
    expose:
      - "3006"
    depends_on:
      location-service:
        condition: service_started
      product-service:
        condition: service_started
      warehouse-service:
        condition: service_started
      routing-service:
        condition: service_started
      demand-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  network-service:
    build: ./services/network-service
    container_name: network-service
    environment:
      PORT: 3007
      LOCATION_SERVICE_URL: http://location-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      WAREHOUSE_SERVICE_URL: http://warehouse-service:3003
      ROUTING_SERVICE_URL: http://routing-service:3004
      DEMAND_SERVICE_URL: http://demand-service:3005
    expose:
      - "3007"
    depends_on:
      location-service:
        condition: service_started
      product-service:
        condition: service_started
      warehouse-service:
        condition: service_started
      routing-service:
        condition: service_started
      demand-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped