name: BWFC Preli CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint Services
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [location-service, product-service, warehouse-service, routing-service, demand-service, validation-service, network-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies for ${{ matrix.service }}
        uses: actions/cache@v4
        id: cache
        with:
          path: services/${{ matrix.service }}/node_modules
          key: bun-modules-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles('services/${{ matrix.service }}/bun.lockb') }}

      - name: Install dependencies for ${{ matrix.service }}
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: services/${{ matrix.service }}
        run: bun install --frozen-lockfile

      - name: Run linter for ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f "package.json" ] && grep -q "\"lint\"" package.json; then
            bun run lint
          else
            echo "No lint script found, skipping..."
          fi
        continue-on-error: true

  build:
    name: Build Docker Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs: [lint]
    strategy:
      matrix:
        service: 
          - location-service
          - product-service
          - warehouse-service
          - routing-service
          - demand-service
          - validation-service
          - network-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner for Docker compatibility
        id: lowercase
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lowercase.outputs.owner_lc }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          load: false

  trivy:
    name: Security Scan (Trivy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    needs: [build]  # Run in parallel with test
    strategy:
      matrix:
        service: 
          - location-service
          - product-service
          - warehouse-service
          - routing-service
          - demand-service
          - validation-service
          - network-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: lowercase
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run Trivy security scan on ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.lowercase.outputs.owner_lc }}/${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

  test:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: [build]  # Wait for images to be built and pushed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Restore test dependencies
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: bun-modules-test-${{ runner.os }}-${{ hashFiles('server/bun.lockb') }}

      - name: Install test dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Lowercase repository owner
        id: lowercase
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR to pull pre-built images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env.dev for testing
        run: |
          cat > .env.dev << EOF
          GHCR_REGISTRY=ghcr.io/${{ steps.lowercase.outputs.owner_lc }}
          IMAGE_TAG=latest
          EOF

      - name: Pull pre-built images from GHCR
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml --env-file .env.dev pull

      - name: Start Docker Compose services
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml --env-file .env.dev up -d --wait
          echo "All services are healthy!"

      - name: Wait for services to be ready
        run: |
          echo "Waiting for databases to initialize..."
          sleep 5
          
          echo "Checking database connectivity..."
          for port in 5433 5434 5435 5436 5437; do
            timeout 30 bash -c "until pg_isready -h localhost -p $port -U devuser; do sleep 1; done"
            echo "Database on port $port is ready"
          done
          
          echo "Waiting for microservices to be ready..."
          sleep 3
          
          echo "Testing service endpoints..."
          max_retries=30
          for i in $(seq 1 $max_retries); do
            if curl -f http://localhost:3000/locations > /dev/null 2>&1; then
              echo "Services are responding!"
              break
            fi
            if [ $i -eq $max_retries ]; then
              echo "Services failed to respond after $max_retries attempts"
              docker compose -f docker-compose.yaml -f docker-compose.dev.yaml --env-file .env.dev logs
              exit 1
            fi
            echo "Attempt $i/$max_retries - waiting..."
            sleep 1
          done

      - name: Run integration tests
        working-directory: server
        run: bun test
        env:
          NODE_ENV: test

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml --env-file .env.dev down -v

  build-summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs: [lint, build, test, trivy]
    if: always()
    steps:
      - name: Pipeline success summary
        run: |
          echo "### 🎯 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scans | ${{ needs.trivy.result == 'success' && '✅ Passed' || '⚠️ See Results' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services Built:**" >> $GITHUB_STEP_SUMMARY
          echo "- location-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- product-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- warehouse-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- routing-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- demand-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- validation-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- network-service:latest (commit: ${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: [test, trivy]  # Wait for both test and security scans
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Pull latest changes (for compose files and configs)
            git pull origin main
            
            # Login to GitHub Container Registry (requires GHCR_PAT secret)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull pre-built images from GHCR (same images that passed tests)
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod pull
            
            # Deploy updated services
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod up -d --wait
            
            # Wait for services to stabilize
            echo "Waiting for services to stabilize..."
            sleep 10
            
            # # Verify services are healthy
            # echo "Verifying deployment health..."
            # max_retries=15
            # for i in $(seq 1 $max_retries); do
            #   if curl -f -k --max-time 5 https://localhost:443/locations > /dev/null 2>&1 || \
            #      curl -f --max-time 5 http://localhost:80/locations > /dev/null 2>&1; then
            #     echo "✅ Deployment verified - services responding"
            #     break
            #   fi
            #   if [ $i -eq $max_retries ]; then
            #     echo "⚠️ Warning: Deployment completed but services not responding"
            #     docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod logs --tail=50
            #   fi
            #   sleep 2
            # done
            
            # Show running services
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod ps
            
            # Clean up unused images
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:** \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services Deployed:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Location Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Product Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Warehouse Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Routing Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Demand Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Validation Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Network Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Traefik Gateway" >> $GITHUB_STEP_SUMMARY