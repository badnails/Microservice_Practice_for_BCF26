name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [location-service, product-service, warehouse-service, routing-service, demand-service, validation-service, network-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies for ${{ matrix.service }}
        uses: actions/cache@v4
        id: cache
        with:
          path: services/${{ matrix.service }}/node_modules
          key: bun-modules-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles('services/${{ matrix.service }}/bun.lockb') }}

      - name: Install dependencies for ${{ matrix.service }}
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: services/${{ matrix.service }}
        run: bun install --frozen-lockfile

  lint:
    name: Lint Services
    runs-on: ubuntu-24.04
    needs: setup
    strategy:
      matrix:
        service: [location-service, product-service, warehouse-service, routing-service, demand-service, validation-service, network-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/node_modules
          key: bun-modules-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles('services/${{ matrix.service }}/bun.lockb') }}

      - name: Run linter for ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f "package.json" ] && grep -q "\"lint\"" package.json; then
            bun run lint
          else
            echo "No lint script found, skipping..."
          fi
        continue-on-error: true

  test:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore test dependencies
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: bun-modules-test-${{ runner.os }}-${{ hashFiles('server/bun.lockb') }}

      - name: Install test dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Start Docker Compose services
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml ps
          curl -f http://localhost:3000/locations || (docker compose -f docker-compose.yaml -f docker-compose.dev.yaml logs && exit 1)

      - name: Run integration tests
        working-directory: server
        run: bun test
        env:
          NODE_ENV: test

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml down -v

      - name: Report test results
        if: always()
        run: |
          echo "### Integration Test Results" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ All integration tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Integration tests failed. Check logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build Docker Images
    runs-on: ubuntu-24.04
    needs: [test]
    strategy:
      matrix:
        service: 
          - location-service
          - product-service
          - warehouse-service
          - routing-service
          - demand-service
          - validation-service
          - network-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          load: true

      - name: Run Trivy security scan on ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

  build-summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs: [build]
    if: always()
    steps:
      - name: Pipeline success summary
        run: |
          echo "### 🎉 CI Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Builds | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scans | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services Built:**" >> $GITHUB_STEP_SUMMARY
          echo "- location-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- product-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- warehouse-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- routing-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- demand-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- validation-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- network-service:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Pull latest changes
            git pull origin main
            
            # Create .env.prod from GitHub Secrets
            cat > .env.prod << EOF
            ENVIRONMENT=production
            DOMAIN=${{ secrets.DOMAIN }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            EOF
            
            # Stop and remove old containers (preserve volumes)
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod down
            
            # Rebuild and start services with parallel build
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod build --parallel
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod up -d
            
            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 10
            
            # Check database health (using env variable user)
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod exec -T locations-db pg_isready -U ${{ secrets.POSTGRES_USER }} || echo "locations-db not ready"
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod exec -T products-db pg_isready -U ${{ secrets.POSTGRES_USER }} || echo "products-db not ready"
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod exec -T warehouse-db pg_isready -U ${{ secrets.POSTGRES_USER }} || echo "warehouse-db not ready"
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod exec -T routing-db pg_isready -U ${{ secrets.POSTGRES_USER }} || echo "routing-db not ready"
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod exec -T demands-db pg_isready -U ${{ secrets.POSTGRES_USER }} || echo "demands-db not ready"
            
            # Verify Traefik is running (with HTTPS)
            curl -f -k https://localhost:443/locations || curl -f http://localhost:80/locations || echo "Traefik gateway not responding"
            
            # Show running services
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env.prod ps
            
            # Clean up unused images
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:** \`${{ secrets.VPS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services Deployed:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Location Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Product Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Warehouse Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Routing Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Demand Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Validation Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Network Service" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Traefik Gateway" >> $GITHUB_STEP_SUMMARY