name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logistics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d logistics -f init.sql

      - name: Start server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logistics
          DB_USER: postgres
          DB_PASSWORD: postgres
          PORT: 3000
        run: |
          bun run index.ts &
          sleep 5
          curl --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3000/locations || echo "Server starting..."

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logistics
          DB_USER: postgres
          DB_PASSWORD: postgres
          PORT: 3000
        run: bun test

      - name: Check TypeScript compilation
        run: bun run --bun index.ts --dry-run || true
