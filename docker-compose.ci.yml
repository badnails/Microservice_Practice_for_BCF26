# CI/CD specific configuration - no HTTPS, simpler setup
networks:
  microservices-network:
    name: bwfc_microservices-network
    driver: bridge

volumes:
  locations-db-data:
  products-db-data:
  warehouse-db-data:
  routing-db-data:
  demands-db-data:

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=bwfc_microservices-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - microservices-network

  # Databases (same as production)
  locations-db:
    image: postgres:15-alpine
    container_name: locations-db
    environment:
      POSTGRES_DB: locations_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - locations-db-data:/var/lib/postgresql/data
      - ./database/location-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  products-db:
    image: postgres:15-alpine
    container_name: products-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - products-db-data:/var/lib/postgresql/data
      - ./database/product-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-db:
    image: postgres:15-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
      - ./database/warehouse-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  routing-db:
    image: postgres:15-alpine
    container_name: routing-db
    environment:
      POSTGRES_DB: routing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - routing-db-data:/var/lib/postgresql/data
      - ./database/routing-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  demands-db:
    image: postgres:15-alpine
    container_name: demands-db
    environment:
      POSTGRES_DB: demands_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - demands-db-data:/var/lib/postgresql/data
      - ./database/demand-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservices (same config, HTTP-only routing)
  location-service:
    build: ./services/location-service
    container_name: location-service
    environment:
      DB_HOST: locations-db
      DB_PORT: 5432
      DB_NAME: locations_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3001
    depends_on:
      locations-db:
        condition: service_healthy
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.locations.rule=PathPrefix(`/locations`)"
      - "traefik.http.routers.locations.entrypoints=web"
      - "traefik.http.services.locations.loadbalancer.server.port=3001"

  product-service:
    build: ./services/product-service
    container_name: product-service
    environment:
      DB_HOST: products-db
      DB_PORT: 5432
      DB_NAME: products_db
    depends_on:
      products-db:
        condition: service_healthy
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.products.rule=PathPrefix(`/products`)"
      - "traefik.http.routers.products.entrypoints=web"
      - "traefik.http.services.products.loadbalancer.server.port=3002"

  warehouse-service:
    build: ./services/warehouse-service
    container_name: warehouse-service
    environment:
      DB_HOST: warehouse-db
      DB_PORT: 5432
      DB_NAME: warehouse_db
      DB_USER: postgres
    depends_on:
      warehouse-db:
        condition: service_healthy
      location-service:
        condition: service_started
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.warehouse.rule=PathPrefix(`/storage-units`)"
      - "traefik.http.routers.warehouse.entrypoints=web"
      - "traefik.http.services.warehouse.loadbalancer.server.port=3003"

  routing-service:
    build: ./services/routing-service
    container_name: routing-service
    environment:
      DB_HOST: routing-db
      DB_PORT: 5432
      DB_NAME: routing_db
      DB_USER: postgres
    depends_on:
      routing-db:
        condition: service_healthy
      location-service:
        condition: service_started
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.routing.rule=PathPrefix(`/routes`)"
      - "traefik.http.routers.routing.entrypoints=web"
      - "traefik.http.services.routing.loadbalancer.server.port=3004"

  demand-service:
    build: ./services/demand-service
    container_name: demand-service
    environment:
      DB_HOST: demands-db
      DB_PORT: 5432
      DB_NAME: demands_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3005
      LOCATION_SERVICE_URL: http://location-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      demands-db:
        condition: service_healthy
      location-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.demands.rule=PathPrefix(`/demands`)"
      - "traefik.http.routers.demands.entrypoints=web"
      - "traefik.http.services.demands.loadbalancer.server.port=3005"

  validation-service:
    build: ./services/validation-service
    container_name: validation-service
    environment:
      PORT: 3006
      LOCATION_SERVICE_URL: http://location-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      WAREHOUSE_SERVICE_URL: http://warehouse-service:3003
      ROUTING_SERVICE_URL: http://routing-service:3004
      DEMAND_SERVICE_URL: http://demand-service:3005
    depends_on:
      location-service:
        condition: service_started
      product-service:
        condition: service_started
      warehouse-service:
        condition: service_started
      routing-service:
        condition: service_started
      demand-service:
        condition: service_started
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.validation.rule=PathPrefix(`/temps`) || PathPrefix(`/network/validate`)"
      - "traefik.http.routers.validation.entrypoints=web"
      - "traefik.http.services.validation.loadbalancer.server.port=3006"

  network-service:
    build: ./services/network-service
    container_name: network-service
    environment:
      PORT: 3007
      LOCATION_SERVICE_URL: http://location-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      WAREHOUSE_SERVICE_URL: http://warehouse-service:3003
      ROUTING_SERVICE_URL: http://routing-service:3004
      DEMAND_SERVICE_URL: http://demand-service:3005
    depends_on:
      location-service:
        condition: service_started
      product-service:
        condition: service_started
      warehouse-service:
        condition: service_started
      routing-service:
        condition: service_started
      demand-service:
        condition: service_started
    networks:
      - microservices-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bwfc_microservices-network"
      - "traefik.http.routers.network.rule=PathPrefix(`/network/summary`)"
      - "traefik.http.routers.network.entrypoints=web"
      - "traefik.http.services.network.loadbalancer.server.port=3007"
